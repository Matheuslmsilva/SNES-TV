<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Controle SNES TV</title>
<style>
  :root {
    --bg: #1a1720; --body: #cfcbd6; --body2: #b5b0bf; --dark: #2e2a36; --ink: #ece9f2; --muted: #9a94a8;
    --a: #d6383c; --b: #e8b71f; --x: #3a63c8; --y: #2f9a4e; --ok: #8fe3a5; --err: #ff8f8f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; }
  [hidden] { display: none !important; }

  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: max(8px, env(safe-area-inset-top)) 14px 6px; z-index: 5; }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .led { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .status.ok .led { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status.err .led { background: var(--err); }
  .status.wait .led { animation: pulse 1s infinite; } @keyframes pulse { 50% { opacity: .3; } }
  .menu-btn { border: 0; background: var(--dark); color: var(--ink); border-radius: 18px; padding: 8px 16px; font: 700 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .menu-btn.on { background: #6c5fc7; }

  /* controle (paisagem) */
  .pad { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .shoulder { position: absolute; top: 44px; width: 30%; height: 52px; background: var(--body2); border-radius: 26px;
    display: flex; align-items: center; justify-content: center; font: 800 20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #4a4553; }
  .shoulder.l { left: 4%; } .shoulder.r { right: 4%; }
  .dpad { position: absolute; left: 6%; bottom: 10%; width: min(42vh, 30vw); height: min(42vh, 30vw); }
  .dpad .d { position: absolute; background: var(--dark); }
  .dpad .up    { left: 33.3%; top: 0; width: 33.4%; height: 38%; border-radius: 8px 8px 0 0; }
  .dpad .down  { left: 33.3%; bottom: 0; width: 33.4%; height: 38%; border-radius: 0 0 8px 8px; }
  .dpad .left  { left: 0; top: 33.3%; width: 38%; height: 33.4%; border-radius: 8px 0 0 8px; }
  .dpad .right { right: 0; top: 33.3%; width: 38%; height: 33.4%; border-radius: 0 8px 8px 0; }
  .dpad .hub { left: 33.3%; top: 33.3%; width: 33.4%; height: 33.4%; background: var(--dark); }
  .face { position: absolute; right: 6%; bottom: 10%; width: min(46vh, 32vw); height: min(46vh, 32vw); }
  .face .f { position: absolute; width: 36%; height: 36%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font: 800 22px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: rgba(255,255,255,.85); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .face .x { left: 32%; top: 0; background: var(--x); }
  .face .a { right: 0; top: 32%; background: var(--a); }
  .face .b { left: 32%; bottom: 0; background: var(--b); }
  .face .y { left: 0; top: 32%; background: var(--y); }
  .mid { position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%); display: flex; gap: 18px; }
  .mid .s { width: 74px; height: 30px; border-radius: 15px; background: var(--dark); display: flex; align-items: center; justify-content: center;
    font: 700 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .08em; color: var(--muted); transform: rotate(-20deg); }
  .on, .pressed { filter: brightness(1.5); }
  .dpad .d.pressed, .mid .s.pressed { background: #6c5fc7; filter: none; }
  .shoulder.pressed { background: #fff; }
  .face .f.pressed { transform: scale(.92); box-shadow: none; }
  .player { position: absolute; left: 50%; top: 50px; transform: translateX(-50%); font: 800 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    padding: 4px 16px; border-radius: 16px; color: #fff; background: var(--dark); }
  .player.p1 { background: var(--a); } .player.p2 { background: var(--x); }
  .player.p3 { background: var(--y); } .player.p4 { background: #b8901a; }
  .pick { display: flex; gap: 10px; }
  .pick label { padding: 10px 18px; border-radius: 12px; background: var(--dark); font-weight: 700; }
  .pick input { margin-right: 6px; }

  /* modelos de controle */
  .tops { display: flex; gap: 8px; }
  body.skin-xbox { --bg: #16181a; --body2: #2c2f33; --dark: #2c2f33; --ink: #e9ecef; }
  body.skin-xbox .shoulder { color: #cfd3d6; border-radius: 26px 26px 12px 12px; }
  body.skin-xbox .face .f { background: #2c2f33; font-size: 26px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.45); }
  body.skin-xbox .face .b { color: #49c25a; } body.skin-xbox .face .a { color: #ff5148; }
  body.skin-xbox .face .y { color: #3f86ff; } body.skin-xbox .face .x { color: #ffc21a; }
  body.skin-xbox .mid .s { transform: none; width: 46px; height: 46px; border-radius: 50%; font-size: 16px; }
  body.skin-ps { --bg: #eceef2; --body2: #ffffff; --dark: #1f2126; --ink: #1f2126; --muted: #6b6f78; }
  body.skin-ps .shoulder { color: #1f2126; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  body.skin-ps .face .f { background: #1f2126; font-size: 28px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.5); }
  body.skin-ps .face .b { color: #8db4ff; } body.skin-ps .face .a { color: #ff6b78; }
  body.skin-ps .face .y { color: #f19be0; } body.skin-ps .face .x { color: #4fd6b4; }
  body.skin-ps .mid .s { transform: none; width: 84px; height: 28px; border-radius: 8px; color: #cfd3d6; font-size: 10px; letter-spacing: .04em; }
  body.skin-ps .menu-btn { background: #1f2126; color: #fff; }
  body.skin-ps .menu-btn.on, body.skin-xbox .menu-btn.on { background: #6c5fc7; }

  .rotate { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; background: var(--bg); z-index: 10; font-size: 18px; }
  @media (orientation: portrait) { .rotate { display: flex; } }

  .code { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 20px; }
  .code input { font: 700 26px ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; width: 220px; text-align: center;
    background: #120f17; color: var(--ink); border: 1px solid #3a3546; border-radius: 12px; padding: 12px; -webkit-user-select: text; user-select: text; }
  .code button { border: 0; border-radius: 12px; padding: 14px 28px; background: #6c5fc7; color: #fff; font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<div class="top">
  <div id="status" class="status wait"><span class="led"></span><span id="status-text">Conectando à TV…</span></div>
  <div class="tops"><button id="skin" class="menu-btn">🎮 SNES</button><button id="menu" class="menu-btn" data-k="menu">MENU</button></div>
</div>

<div class="pad" id="pad">
  <div class="shoulder l" data-k="10" id="lbl-l">L</div>
  <div class="shoulder r" data-k="11" id="lbl-r">R</div>
  <div class="player" id="player"></div>
  <div class="dpad">
    <div class="d up" data-k="4"></div><div class="d down" data-k="5"></div>
    <div class="d left" data-k="6"></div><div class="d right" data-k="7"></div>
    <div class="d hub" data-k="hub"></div>
  </div>
  <div class="mid"><div class="s" data-k="2" id="lbl-sel">SELECT</div><div class="s" data-k="3" id="lbl-start">START</div></div>
  <div class="face">
    <div class="f x" data-k="9" id="lbl-x">X</div><div class="f a" data-k="8" id="lbl-a">A</div>
    <div class="f b" data-k="0" id="lbl-b">B</div><div class="f y" data-k="1" id="lbl-y">Y</div>
  </div>
</div>

<div class="rotate">↻ Vire o celular de lado para usar o controle</div>

<form class="code" id="code-form" hidden>
  <div>Digite o código que aparece na TV</div>
  <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters">
  <div class="pick">
    <label><input type="radio" name="pl" value="1" checked>Jogador 1</label>
    <label><input type="radio" name="pl" value="2">Jogador 2</label>
    <label><input type="radio" name="pl" value="3">3</label>
    <label><input type="radio" name="pl" value="4">4</label>
  </div>
  <button type="submit">Conectar</button>
</form>

<script src="js/compat.js?v=202610262303"></script>
<script src="lib/peerjs.min.js?v=202610262303"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  // link do QR Code: controle.html#CODIGO-2  (código da TV + número do jogador)
  var hash = (location.hash || "").replace("#", "").toUpperCase().split("-");
  var code = hash[0] || "";
  var wantPlayer = +hash[1] || 1;
  function showPlayer(n) {
    var el = $("player");
    el.textContent = "Jogador " + n;
    el.className = "player p" + n;
  }
  var peer = null, conn = null, mask = 0, menu = false, retry = null;

  function status(kind, text) { $("status").className = "status " + kind; $("status-text").textContent = text; }

  function send() {
    if (conn && conn.open) { try { conn.send({ t: "pad", m: mask, menu: menu }); } catch (e) {} }
  }
  // reenvia o estado de tempos em tempos (se um pacote se perder, corrige sozinho)
  setInterval(send, 150);

  // ---------- toque: vários dedos e deslizar entre botões ----------
  var touches = {};   // id do toque -> lista de teclas
  function keysAt(x, y) {
    var el = document.elementFromPoint(x, y);
    while (el && !el.getAttribute("data-k") && el !== document.body) el = el.parentNode;
    if (!el || !el.getAttribute) return [];
    var k = el.getAttribute("data-k");
    if (!k) return [];
    if (k === "hub") return [];
    // diagonais: perto da borda entre duas direções
    if (/^[4-7]$/.test(k)) {
      var box = el.parentNode.getBoundingClientRect();
      var rx = (x - box.left) / box.width, ry = (y - box.top) / box.height, out = [];
      if (ry < 0.4) out.push("4"); if (ry > 0.6) out.push("5");
      if (rx < 0.4) out.push("6"); if (rx > 0.6) out.push("7");
      return out.length ? out : [k];
    }
    return [k];
  }
  function recompute() {
    var m = 0, mn = false, all = {};
    Object.keys(touches).forEach(function (id) {
      touches[id].forEach(function (k) { all[k] = 1; if (k === "menu") mn = true; else m |= 1 << (+k); });
    });
    var els = document.querySelectorAll("[data-k]");
    for (var i = 0; i < els.length; i++) els[i].classList.toggle("pressed", !!all[els[i].getAttribute("data-k")]);
    if (m !== mask || mn !== menu) {
      if ((m & ~mask) && navigator.vibrate) navigator.vibrate(12);
      mask = m; menu = mn; send();
    }
  }
  // ---------- modelo do controle (só o visual; os botões ficam na mesma posição do SNES) ----------
  // ordem dos rótulos: cima, direita, baixo, esquerda, L, R, select, start
  var SKINS = {
    snes: { name: "SNES", l: ["X", "A", "B", "Y", "L", "R", "SELECT", "START"] },
    xbox: { name: "Xbox", l: ["Y", "B", "A", "X", "LB", "RB", "⧉", "☰"] },
    ps:   { name: "PS5", l: ["△", "○", "✕", "□", "L1", "R1", "CREATE", "OPTIONS"] }
  };
  var ORDER = ["snes", "xbox", "ps"], skin = "snes";
  try { skin = localStorage.getItem("snestv.padskin") || "snes"; } catch (e) {}
  function applySkin(k) {
    if (!SKINS[k]) k = "snes";
    skin = k;
    var L = SKINS[k].l, ids = ["lbl-x", "lbl-a", "lbl-b", "lbl-y", "lbl-l", "lbl-r", "lbl-sel", "lbl-start"];
    ids.forEach(function (id, i) { $(id).textContent = L[i]; });
    document.body.className = "skin-" + k;
    $("skin").textContent = "🎮 " + SKINS[k].name;
    try { localStorage.setItem("snestv.padskin", k); } catch (e) {}
    if (conn && conn.open) { try { conn.send({ t: "skin", s: k }); } catch (e) {} }
  }
  function nextSkin() { applySkin(ORDER[(ORDER.indexOf(skin) + 1) % ORDER.length]); if (navigator.vibrate) navigator.vibrate(20); }
  $("skin").addEventListener("click", function (e) { e.preventDefault(); nextSkin(); });

  function onTouch(e) {
    if (e.target && e.target.closest && e.target.closest("form")) return;   // deixa digitar o código
    if (e.target && e.target.closest && e.target.closest("#skin")) { if (e.type === "touchstart") { e.preventDefault(); nextSkin(); } return; }
    e.preventDefault();
    var list = e.changedTouches;
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (e.type === "touchend" || e.type === "touchcancel") delete touches[t.identifier];
      else touches[t.identifier] = keysAt(t.clientX, t.clientY);
    }
    recompute();
    if (e.type === "touchstart") goFull();
  }
  ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (ev) {
    document.addEventListener(ev, onTouch, { passive: false });
  });
  // mouse (para testar no PC)
  var mdown = false;
  document.addEventListener("mousedown", function (e) { if (e.target.closest && e.target.closest("#skin")) return; mdown = true; touches.m = keysAt(e.clientX, e.clientY); recompute(); });
  document.addEventListener("mousemove", function (e) { if (mdown) { touches.m = keysAt(e.clientX, e.clientY); recompute(); } });
  document.addEventListener("mouseup", function () { mdown = false; delete touches.m; recompute(); });

  function goFull() {
    var d = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    try { (d.requestFullscreen || d.webkitRequestFullscreen).call(d).then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
    }).catch(function () {}); } catch (e) {}
  }

  // ---------- conexão com a TV ----------
  function connect() {
    clearTimeout(retry);
    var P = window.Peer || (window.peerjs && window.peerjs.Peer);
    if (!P) { status("err", "Erro ao carregar"); return; }
    if (!peer || peer.destroyed) {
      peer = new P();
      peer.on("open", function () { dial(); });
      peer.on("error", function (err) {
        if (err.type === "peer-unavailable") status("wait", "Procurando a TV… (abra a tela do QR Code na TV)");
        else status("err", "Sem internet — tentando de novo");
        retry = setTimeout(connect, 2500);
      });
      peer.on("disconnected", function () { try { peer.reconnect(); } catch (e) {} });
    } else dial();
  }
  function dial() {
    status("wait", "Conectando à TV…");
    conn = peer.connect("snestv-pad-" + code, { reliable: true, serialization: "json", metadata: { player: wantPlayer } });
    conn.on("open", function () { status("ok", "Conectado"); send(); try { conn.send({ t: "skin", s: skin }); } catch (e) {} });
    conn.on("data", function (d) {
      if (d && d.t === "hi") { wantPlayer = d.player; showPlayer(d.player); }
    });
    conn.on("close", function () { status("wait", "Reconectando…"); retry = setTimeout(connect, 2000); });
    conn.on("error", function () { retry = setTimeout(connect, 2000); });
  }

  function start(c) {
    code = (c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length !== 6) { $("code-form").hidden = false; return; }
    $("code-form").hidden = true;
    connect();
  }
  $("code-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var r = document.querySelector('input[name="pl"]:checked');
    wantPlayer = r ? +r.value : 1;
    start($("code").value);
  });
  showPlayer(wantPlayer);
  applySkin(skin);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && (!conn || !conn.open)) connect(); });
  start(code);
})();
</script>
</body>
</html>
